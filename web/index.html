<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>MeWallpaper</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<style>
:root{
  --bg:#eef1f7;
  --panel:rgba(255,255,255,.62);
  --panel-strong:rgba(255,255,255,.85);
  --border:rgba(30,41,59,.09);
  --border-hi:rgba(30,41,59,.18);
  --text:#1c2436;
  --text-dim:#5c6579;
  --text-faint:#8b93a7;
  --accent:#4f6ef7;
  --accent2:#9b5cf6;
  --grad:linear-gradient(135deg,#4f6ef7,#9b5cf6);
  --danger:#e5484d;
  --radius:16px;
  --shadow:0 10px 34px rgba(35,48,86,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;user-select:none;
}
/* 柔和光斑背景 */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora::before,.aurora::after{
  content:"";position:absolute;width:56vw;height:56vw;border-radius:50%;
  filter:blur(110px);opacity:.55;animation:drift 28s ease-in-out infinite alternate;
}
.aurora::before{background:#c3d4ff;top:-22%;left:-12%}
.aurora::after{background:#e3ccff;bottom:-28%;right:-12%;animation-delay:-14s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(5vw,4vh) scale(1.12)}}
#app{position:relative;z-index:2;display:flex;height:100vh}

/* ---------- 侧边栏 ---------- */
.sidebar{
  width:218px;flex-shrink:0;display:flex;flex-direction:column;
  padding:22px 14px;gap:5px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border-right:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-weight:700;font-size:16px;letter-spacing:.5px}
.logo-name{font-weight:700;font-size:16px;letter-spacing:.3px;line-height:1.2}
.logo-tag{font-size:10px;color:var(--text-faint);font-weight:500;margin-top:2px;letter-spacing:.4px}
.logo-badge{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  filter:drop-shadow(0 4px 10px rgba(79,110,247,.35));
}
.logo-badge img{width:34px;height:34px;object-fit:contain}
.logo-badge svg{width:18px;height:18px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;
  color:var(--text-dim);cursor:pointer;border:1px solid transparent;
  transition:all .2s cubic-bezier(.4,0,.2,1);font-weight:500;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.7)}
.nav-item.active{
  color:var(--accent);background:var(--panel-strong);border-color:var(--border);
  box-shadow:0 3px 12px rgba(35,48,86,.10);font-weight:600;
}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.now-card{
  padding:12px 14px;border-radius:14px;background:var(--panel-strong);
  border:1px solid var(--border);backdrop-filter:blur(12px);
}
.now-label{font-size:11px;color:var(--text-faint);margin-bottom:4px;letter-spacing:1px}
.now-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-sub{font-size:11px;color:var(--text-dim);margin-top:3px;display:flex;align-items:center;gap:5px}
.now-sub .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel-strong);color:var(--text);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .18s;font-family:inherit;
}
.btn svg{width:15px;height:15px}
.btn:hover{border-color:var(--border-hi);transform:translateY(-1px);box-shadow:0 4px 14px rgba(35,48,86,.12)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 16px rgba(99,94,247,.35)}
.btn.primary:hover{box-shadow:0 6px 22px rgba(99,94,247,.45);filter:brightness(1.05)}
.btn.block{width:100%}
.btn.ghost{background:transparent}

/* ---------- 主区域 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:18px 26px 14px}
.page-title{font-size:20px;font-weight:700}
.page-sub{color:var(--text-faint);font-size:12px;margin-top:2px}
.search-box{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:12px;background:var(--panel-strong);
  border:1px solid var(--border);min-width:240px;transition:border-color .2s,box-shadow .2s;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.search-box svg{width:15px;height:15px;color:var(--text-faint);display:block;flex-shrink:0}
.search-box input{line-height:1.2;padding:0;height:auto}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit}
.search-box input::placeholder{color:var(--text-faint)}
.content{flex:1;overflow-y:auto;padding:6px 26px 26px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:rgba(30,41,59,.14);border-radius:4px}
.content::-webkit-scrollbar-thumb:hover{background:rgba(30,41,59,.28)}

/* ---------- 壁纸网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{
  position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;
  background:var(--panel-strong);border:1px solid var(--border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:transform .26s cubic-bezier(.34,1.35,.64,1),box-shadow .26s,border-color .26s;
  animation:pop .45s cubic-bezier(.22,1,.36,1) backwards;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.card:hover{transform:translateY(-5px);border-color:var(--border-hi);box-shadow:var(--shadow)}
.card-img{position:relative;aspect-ratio:16/9;overflow:hidden;background:#e4e8f1}
.card-badge{position:absolute;top:6px;left:6px;padding:1px 7px;border-radius:4px;
  background:rgba(30,40,60,.72);color:#fff;font-size:11px;pointer-events:none}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.card:hover .card-img img{transform:scale(1.06)}
.card-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,25,40,.38),transparent 42%);pointer-events:none}
.badge-play{
  position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;
  background:rgba(20,25,40,.5);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;color:#fff;
  border:1px solid rgba(255,255,255,.35);
}
.badge-play svg{width:12px;height:12px;margin-left:1px}
.badge-live{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:1px;color:#fff;
  background:rgba(20,25,40,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3)}
.badge-live .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse 1.6s infinite}
.card-actions{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;
  background:rgba(20,25,40,.35);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.card:hover .card-actions{opacity:1;pointer-events:auto}
.act-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.92);color:#28304a;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .16s;
  transform:translateY(6px);
}
.act-btn svg{width:17px;height:17px}
.card:hover .act-btn{transform:translateY(0)}
.card:hover .act-btn:nth-child(2){transition-delay:.03s}
.card:hover .act-btn:nth-child(3){transition-delay:.06s}
.card:hover .act-btn:nth-child(4){transition-delay:.09s}
.act-btn:hover{background:var(--grad);border-color:transparent;color:#fff;transform:scale(1.12)!important}

/* ---------- 即时汉字提示（复用 title 属性，悬停即现） ---------- */
[title]{position:relative}
.act-btn[title]:hover::after,.nav-item[title]:hover::after,.btn[title]:hover::after,
.lb-close[title]:hover::after{content:attr(title);position:absolute;bottom:calc(100% + 9px);left:50%;
  transform:translateX(-50%);padding:5px 11px;border-radius:8px;background:rgba(28,33,48,.94);
  color:#fff;font-size:12px;font-weight:500;white-space:nowrap;pointer-events:none;z-index:60;
  box-shadow:0 4px 14px rgba(0,0,0,.22);animation:tip-in .16s cubic-bezier(.22,1,.36,1)}
.nav-item[title]:hover::after{left:calc(100% - 8px);transform:none;bottom:auto;top:50%;translate:0 -50%}
@keyframes tip-in{from{opacity:0;transform:translateX(-50%) translateY(4px)}}
.nav-item[title]:hover::after{animation:tip-in-r .16s cubic-bezier(.22,1,.36,1)}
@keyframes tip-in-r{from{opacity:0;translate:0 calc(-50% + 4px)}}
.act-btn.fav-on{color:#f5a623}
.card-info{display:flex;align-items:center;gap:8px;padding:11px 14px}
.card-title{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-src{font-size:10px;color:var(--text-faint);flex-shrink:0;padding:3px 8px;border-radius:99px;background:rgba(30,41,59,.06)}

.skeleton{border-radius:var(--radius);aspect-ratio:16/11.4;background:linear-gradient(100deg,rgba(255,255,255,.4) 40%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.4) 60%);background-size:200% 100%;animation:shimmer 1.4s infinite;border:1px solid var(--border)}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{padding:80px 0;text-align:center;color:var(--text-faint)}
.empty svg{width:52px;height:52px;opacity:.35;margin-bottom:12px}
.empty .tip{font-size:13px}

/* ---------- 在线页 ---------- */
.online-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
select,input[type=number],input[type=text]{
  padding:9px 13px;border-radius:11px;background:var(--panel-strong);border:1px solid var(--border);
  color:var(--text);font-size:13px;outline:none;font-family:inherit;transition:border-color .2s;
}
select:focus,input:focus{border-color:var(--accent)}
select option{background:#fff}
.pager{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:22px}

/* ---------- 设置页 ---------- */
.settings{max-width:640px;display:flex;flex-direction:column;gap:14px}
.set-group{
  border-radius:var(--radius);background:var(--panel-strong);border:1px solid var(--border);
  padding:18px 20px;backdrop-filter:blur(16px);
}
.set-group h3{font-size:13px;color:var(--text-dim);font-weight:600;margin-bottom:14px;letter-spacing:1px}
.set-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.set-row>label:first-child{width:110px;flex-shrink:0;color:var(--text-dim);font-size:13px}
.set-row input[type=text],.set-row select{flex:1}
.switch{position:relative;width:42px;height:24px;flex-shrink:0;cursor:pointer}
.switch input{display:none}
.switch .track{position:absolute;inset:0;border-radius:99px;background:rgba(30,41,59,.16);transition:.25s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.25s cubic-bezier(.34,1.3,.64,1)}
.switch input:checked+.track{background:var(--grad)}
.switch input:checked+.track::after{transform:translateX(18px)}
input[type=range]{flex:1;accent-color:var(--accent)}

/* ---------- 灯箱 ---------- */
.lightbox{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(28,32,46,.55);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox img{max-width:82vw;max-height:76vh;border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.4);object-fit:contain;background:#fff}
.lb-actions{position:absolute;bottom:34px;display:flex;gap:12px}
.lb-close{position:absolute;top:22px;right:28px;width:38px;height:38px;border-radius:50%;font-size:16px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);cursor:pointer}
.lb-close:hover{background:rgba(255,255,255,.25)}

/* ---------- Toast ---------- */
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  padding:11px 20px;border-radius:99px;font-size:13px;font-weight:500;
  background:rgba(28,33,48,.92);border:1px solid rgba(255,255,255,.14);color:#fff;
  backdrop-filter:blur(16px);box-shadow:var(--shadow);
  animation:toast-in .3s cubic-bezier(.22,1,.36,1);
  display:flex;align-items:center;gap:8px;max-width:70vw;
}
.toast svg{width:15px;height:15px;flex-shrink:0}
.toast.err{border-color:rgba(229,72,77,.6)}
@keyframes toast-in{from{opacity:0;transform:translateY(12px) scale(.94)}}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}

@media (max-width:760px){
  .sidebar{width:64px;padding:18px 8px}
  .logo span,.nav-item span,.now-card{display:none}
  .nav-item{justify-content:center;padding:11px 0}
}

/* ---------- 删除确认弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(20,25,40,.42);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:200;animation:tip-in .14s ease}
.modal-box{background:#fff;border-radius:16px;padding:26px 28px;min-width:340px;
  box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pop .2s cubic-bezier(.22,1,.36,1)}
.modal-box h3{margin:0 0 8px;font-size:16px;color:#1f2537}
.modal-box p{margin:0 0 20px;font-size:13px;color:var(--text-dim)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn.danger{background:#e5484d;border-color:transparent;color:#fff}
.btn.danger:hover{background:#d13438}
</style>
</head>
<body>
<div class="aurora"></div>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-badge" id="logoBadge"><img src="/assets/logo.png" alt="MeWallpaper"></div><div><div class="logo-name">MeWallpaper</div>
    <div class="logo-tag">本地优先 · Python+mpv 内核</div></div></div>
    <div class="nav-item active" data-page="images"><span data-ico="image"></span><span>静态壁纸</span></div>
    <div class="nav-item" data-page="videos"><span data-ico="film"></span><span>动态壁纸</span></div>
    <div class="nav-item" data-page="online"><span data-ico="globe"></span><span>在线发现</span></div>
    <div class="nav-item" data-page="settings"><span data-ico="sliders"></span><span>设置</span></div>
    <div class="side-foot">
      <div class="now-card">
        <div class="now-label">当前壁纸</div>
        <div class="now-title" id="nowTitle">—</div>
        <div class="now-sub"><span class="dot" id="nowDot" style="display:none"></span><span id="nowSub"></span></div>
      </div>
      <button class="btn primary block" id="btnShuffle" title="从壁纸库随机换一张"><span data-ico="shuffle"></span>随机换一张</button>
      <button class="btn block" id="btnImportDir" title="把存储目录（E:\LiveWallpaper 等）里的壁纸文件导入到库"><span data-ico="upload"></span>一键导入目录</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="pageTitle">静态壁纸</div>
        <div class="page-sub" id="pageSub"></div>
      </div>
      <div class="search-box" id="searchWrap">
        <span data-ico="search"></span><input id="searchInput" placeholder="搜索壁纸名称…" title="按名称搜索壁纸">
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" title="关闭预览">✕</button>
  <img id="lbImg" src="">
  <div class="lb-actions">
    <button class="btn primary" id="lbSet">设为壁纸</button>
    <button class="btn" id="lbCrop">裁剪区域</button>
  </div>
</div>
<div id="toasts"></div>

<script>
/* ---------- 极简 SVG 图标（lucide 风格线性图标） ---------- */
const I={
image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
film:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
sliders:'<line x1="21" y1="6" x2="11" y2="6"/><line x1="11" y1="12" x2="3" y2="12"/><line x1="21" y1="18" x2="13" y2="18"/><circle cx="8" cy="6" r="2"/><circle cx="14" cy="12" r="2"/><circle cx="10" cy="18" r="2"/>',
search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
check:'<polyline points="20 6 9 17 4 12"/>',
play:'<polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/>',
star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>',
download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
shuffle:'<path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/>',
x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
checkcircle:'<circle cx="12" cy="12" r="10"/><polyline points="8.5 12 11 14.5 15.5 9.5"/>',
camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>'
};
const icon=(n)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(I[n]||'')+'</svg>';

const $=s=>document.querySelector(s);
document.querySelectorAll('[data-ico]').forEach(el=>el.innerHTML=icon(el.dataset.ico));
const api=async(url,opt)=>{
  const r=await fetch(url,Object.assign({cache:'no-store'},
    opt?{headers:{'Content-Type':'application/json'},...opt}:undefined));
  if(!r.ok){let e;try{e=(await r.json()).error}catch(_){e=r.statusText}throw new Error(e)}
  return r.json();
};
const post=(url,data)=>api(url,{method:'POST',body:JSON.stringify(data||{})});

let state={page:'images',items:[],onlineInited:false,onlinePage:1,lbPath:''};
const TITLES={images:['静态壁纸','点击卡片预览大图'],videos:['动态壁纸','点击卡片设为动态壁纸'],online:['在线发现','Wallhaven · 必应每日 · Picsum · 维基视频(动态)'],settings:['设置','']};

function toast(msg,err){
  const t=document.createElement('div');t.className='toast'+(err?' err':'');
  t.innerHTML=icon(err?'x':'checkcircle')+'<span></span>';
  t.querySelector('span').textContent=msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2600);
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* 删除确认：返回 'keep' | 'file' | 'cancel' */
function askDelete(){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<div class="modal-box"><h3>移除壁纸</h3>
      <p>「仅移出库」保留磁盘文件；「连文件一起删除」不可恢复。</p>
      <div class="modal-btns">
        <button class="btn" data-r="keep">仅移出库</button>
        <button class="btn danger" data-r="file">连文件一起删除</button>
        <button class="btn" data-r="cancel">取消</button>
      </div></div>`;
    document.body.appendChild(m);
    m.addEventListener('click',e=>{
      if(e.target===m){m.remove();res('cancel');return}
      const b=e.target.closest('[data-r]');
      if(b){m.remove();res(b.dataset.r)}
    });
  });
}

/* ---------- 导航 ---------- */
document.querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  state.page=el.dataset.page;
  $('#pageTitle').textContent=TITLES[state.page][0];
  $('#pageSub').textContent=TITLES[state.page][1];
  $('#searchWrap').style.visibility=state.page==='settings'?'hidden':'visible';
  $('#searchInput').value='';
  render();
});
$('#searchInput').oninput=()=>{if(state.page!=='online'&&state.page!=='settings')render()};
$('#btnShuffle').onclick=async()=>{try{await post('/api/slideshow/now');toast('已随机切换');refreshNow()}catch(e){toast(e.message,true)}};
$('#btnImportDir').onclick=async()=>{try{
  toast('正在导入目录…');
  const r=await post('/api/scan');
  toast(r.added>0?`已导入 ${r.added} 个壁纸`:'目录里没有新壁纸');
  render();refreshNow();
}catch(e){toast(e.message,true)}};

async function refreshNow(){
  try{
    const s=await api('/api/state');
    $('#nowTitle').textContent=s.current.title||'—';
    $('#nowSub').textContent=s.current.type==='video'?'动态壁纸':'静态壁纸';
    $('#nowDot').style.display=(s.current.type==='video'&&s.video_attached)?'':'none';
  }catch(_){}
}

/* ---------- 卡片（data 属性 + 事件委托，杜绝路径转义问题） ---------- */
function cardHTML(it,i){
  const btns=[];
  if(it.type==='video'){
    btns.push(['set',it.path,'check','设为壁纸'],['preview',it.path,'play','预览'],
          ['frame',it.path,'camera','截帧设壁纸']);
  }else{
    btns.push(['set',it.path,'check','设为壁纸'],['crop',it.path,'scissors','裁剪区域']);
  }
  btns.push(['fav',it.path,'star','收藏'],['del',it.path,'trash','移除']);
  return `<div class="card" style="animation-delay:${Math.min(i*35,500)}ms" data-path="${esc(it.path)}" data-type="${it.type}">
    <div class="card-img"><img loading="lazy" src="${it.thumb}" alt="">
      ${it.type==='video'?`<div class="badge-play">${icon('play')}</div><div class="badge-live"><span class="dot"></span>LIVE</div>`:''}
      <div class="card-actions">${btns.map(b=>`<button class="act-btn${b[0]==='fav'&&it.favorite?' fav-on':''}" data-act="${b[0]}" data-path="${esc(b[1])}" title="${b[3]}">${icon(b[2])}</button>`).join('')}</div>
    </div>
    <div class="card-info"><div class="card-title">${esc(it.title)}</div><div class="card-src">${esc(it.source)}</div></div>
  </div>`;
}
/* 全局事件委托 */
$('#content').addEventListener('click',async e=>{
  const actBtn=e.target.closest('.act-btn');
  if(actBtn){
    e.stopPropagation();
    const p=actBtn.dataset.path,a=actBtn.dataset.act;
    try{
      if(a==='set'){await post('/api/set',{path:p});toast('已设置壁纸');refreshNow()}
      else if(a==='preview'){await post('/api/preview_video',{path:p});toast('预览窗口已打开')}
      else if(a==='fav'){const r=await post('/api/favorite',{path:p});actBtn.classList.toggle('fav-on',r.favorite);toast(r.favorite?'已收藏':'已取消收藏')}
      else if(a==='del'){
        const r=await askDelete();
        if(r==='cancel')return;
        await post('/api/delete',{path:p,delete_file:r==='file'});
        toast(r==='file'?'已从磁盘删除':'已移出库（文件保留）');
        render();refreshNow();
      }
      else if(a==='crop'){await post('/api/crop',{path:p});toast('截图裁剪已启动')}
      else if(a==='frame'){await post('/api/video_frame',{path:p});toast('截帧窗口已打开')}
    }catch(err){toast(err.message,true)}
    return;
  }
  const card=e.target.closest('.card');
  if(card){
    const p=card.dataset.path,type=card.dataset.type;
    if(type==='video'){
      try{await post('/api/set',{path:p});toast('已设置动态壁纸');refreshNow()}catch(err){toast(err.message,true)}
    }else{
      state.lbPath=p;$('#lbImg').src='/api/raw?path='+encodeURIComponent(p);
      $('#lightbox').classList.add('on');
    }
  }
});

function closeLightbox(){$('#lightbox').classList.remove('on')}
$('#lbClose').onclick=closeLightbox;
$('#lbSet').onclick=async()=>{try{await post('/api/set',{path:state.lbPath});toast('已设置壁纸');refreshNow()}catch(e){toast(e.message,true)}closeLightbox()};
$('#lbCrop').onclick=async()=>{try{await post('/api/crop',{path:state.lbPath})}catch(e){}closeLightbox()};
$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});

/* ---------- 在线（首次进入自动搜索一次；切走再切回时重建 DOM） ---------- */
function renderOnline(){
  if(document.getElementById('olGrid'))return;  // DOM 还在，直接显示
  const c=$('#content');
  c.innerHTML=`<div class="online-bar">
    <select id="olSrc"><option>Wallhaven</option><option>必应每日</option><option>Picsum 摄影</option><option>维基视频(动态)</option></select>
    <input type="text" id="olQ" placeholder="搜索关键词（Wallhaven）…" style="flex:1;min-width:180px">
    <select id="olSort"><option value="favorites">按收藏</option><option value="views">按浏览</option><option value="date_added">最新</option><option value="random">随机</option></select>
    <button class="btn primary" id="olGo">${icon('search')}搜索</button></div>
    <div class="grid" id="olGrid"></div>
    <div class="pager"><button class="btn" id="olPrev">← 上一页</button><span id="olPage" style="color:var(--text-dim)">1</span><button class="btn" id="olNext">下一页 →</button></div>`;
  $('#olGo').onclick=()=>{state.onlinePage=1;onlineSearch()};
  $('#olQ').onkeydown=e=>{if(e.key==='Enter'){state.onlinePage=1;onlineSearch()}};
  $('#olSrc').onchange=()=>{state.onlinePage=1;onlineSearch()};
  $('#olPrev').onclick=()=>{if(state.onlinePage>1){state.onlinePage--;onlineSearch()}};
  $('#olNext').onclick=()=>{state.onlinePage++;onlineSearch()};
  $('#olGrid').addEventListener('click',async e=>{
    const card=e.target.closest('.card');
    if(!card)return;
    toast('下载中…');
    try{await post('/api/online/download',{id:card.dataset.id,set:true});toast('已下载并设为壁纸');refreshNow()}
    catch(err){toast('下载失败：'+err.message,true)}
  });
  // DOM 是新建的（从别的页切回来），总是拉一次结果填充；
  // state.onlineSearched 只用于避免首次进入前的重复触发
  setTimeout(onlineSearch,50);
}
async function onlineSearch(){
  const grid=$('#olGrid');if(!grid)return;
  grid.innerHTML=Array(12).fill('<div class="skeleton"></div>').join('');
  try{
    const p=new URLSearchParams({source:$('#olSrc').value,query:$('#olQ').value,
      sorting:$('#olSort').value,page:state.onlinePage});
    const items=await api('/api/online/search?'+p);
    $('#olPage').textContent=state.onlinePage;
    if(!items.length){grid.innerHTML=`<div class="empty">${icon('search')}<div class="tip">没有结果，换个关键词试试</div></div>`;return}
    grid.innerHTML=items.map((it,i)=>`<div class="card" style="animation-delay:${Math.min(i*30,450)}ms" data-id="${esc(it.id)}">
      <div class="card-img"><img loading="lazy" src="${it.thumb}" alt="">
        ${it.video?'<span class="card-badge">动态</span>':''}
        <div class="card-actions"><button class="act-btn" title="下载并设为壁纸">${icon('download')}</button></div></div>
      <div class="card-info"><div class="card-title">${esc(it.title)}</div>
        <div class="card-src">${esc(it.res)}${it.fav?' ★'+it.fav:''}</div></div>
    </div>`).join('');
  }catch(e){
    grid.innerHTML=`<div class="empty">${icon('x')}<div class="tip">${esc(e.message)}</div></div>`;
  }
}

/* ---------- 设置 ---------- */
let settingsCache=null;
async function renderSettings(){
  const c=$('#content');
  if(!settingsCache){
    try{settingsCache=await api('/api/settings')}catch(e){toast(e.message,true);return}
  }
  const s=settingsCache;
  const row=(label,inner)=>`<div class="set-row"><label>${label}</label>${inner}</div>`;
  const sw=(key,on)=>`<label class="switch"><input type="checkbox" data-k="${key}" ${on?'checked':''}><span class="track"></span></label>`;
  c.innerHTML=`<div class="settings">
    <div class="set-group"><h3>壁纸</h3>
      ${row('填充方式',`<select data-k="wallpaper_style">
        <option value="fill" ${s.wallpaper_style==='fill'?'selected':''}>填充（推荐）</option>
        <option value="fit" ${s.wallpaper_style==='fit'?'selected':''}>适应</option>
        <option value="stretch" ${s.wallpaper_style==='stretch'?'selected':''}>拉伸</option>
        <option value="center" ${s.wallpaper_style==='center'?'selected':''}>居中</option></select>`)}
      <div class="set-row"><label style="width:auto;flex:1">定时轮播</label>${sw('slideshow_enabled',s.slideshow_enabled)}</div>
      ${row('间隔(分钟)',`<input type="number" min="1" max="1440" data-k="slideshow_minutes" value="${s.slideshow_minutes??30}">`)}
    </div>
    <div class="set-group"><h3>动态壁纸（mpv 内核）</h3>
      ${row('音量',`<input type="range" min="0" max="100" data-k="video_volume" value="${s.video_volume??0}"><span id="volTxt">${s.video_volume??0}%</span>`)}
      <div class="set-row"><label style="width:auto;flex:1">尝试硬件解码</label>${sw('video_hw_decode',s.video_hw_decode!==false)}</div>
      <div class="set-row"><label style="width:auto;flex:1">其他程序全屏时暂停</label>${sw('video_paused_on_fullscreen',s.video_paused_on_fullscreen!==false)}</div>
      <div class="set-row"><label style="width:auto;flex:1">画面拉伸铺满（否则保持比例）</label>${sw('video_stretch',s.video_stretch)}</div>
      <div class="set-row"><label style="width:auto;flex:1">循环播放（关闭则播完即停）</label>${sw('video_loop',s.video_loop!==false)}</div>
    </div>
    <div class="set-group"><h3>存储</h3>
      <div class="set-row"><label>存储目录</label><input type="text" data-k="download_dir" value="${esc(s.download_dir||'E:\\LiveWallpaper')}" placeholder="在线壁纸保存位置，如 E:\\LiveWallpaper">
        <button class="btn" id="btnOpenDir">${icon('download')}打开目录</button></div>
    </div>
    <div class="set-group"><h3>在线源</h3>
      ${row('代理',`<input type="text" data-k="proxy" value="${esc(s.proxy||'')}" placeholder="留空自动用系统代理；direct 强制直连">`)}
      ${row('API Key',`<input type="text" data-k="wallhaven_api_key" value="${esc(s.wallhaven_api_key||'')}" placeholder="可选，留空 45 次/分钟">`)}
    </div>
    <div class="set-group"><h3>其他</h3>
      <div class="set-row"><label style="width:auto;flex:1">开机自动启动</label>${sw('auto_start',s.auto_start)}</div>
      <div class="set-row"><label style="width:auto;flex:1"></label>
        <button class="btn" id="btnImport">${icon('upload')}导入壁纸文件…</button>
        <button class="btn" id="btnScan">${icon('refresh')}重新扫描目录</button></div>
    </div>
  </div>`;
  c.querySelectorAll('[data-k]').forEach(el=>{
    el.onchange=async()=>{
      let v;
      if(el.type==='checkbox')v=el.checked;
      else if(el.type==='number'||el.type==='range')v=parseInt(el.value);
      else v=el.value;
      try{await post('/api/settings',{[el.dataset.k]:v});settingsCache=null;toast('已保存')}
      catch(e){toast(e.message,true)}
      if(el.dataset.k==='video_volume')$('#volTxt').textContent=v+'%';
    };
  });
  $('#btnImport').onclick=async()=>{try{await post('/api/import');toast('导入完成');render();refreshNow()}catch(e){toast(e.message,true)}};
  $('#btnScan').onclick=async()=>{try{const r=await post('/api/scan');toast(r.added>0?`已导入 ${r.added} 个壁纸`:'没有新文件');render()}catch(e){toast(e.message,true)}};
  $('#btnOpenDir').onclick=async()=>{try{await post('/api/open_folder',{});toast('已打开存储目录')}catch(e){toast(e.message,true)}};
}

/* ---------- 渲染调度 ---------- */
async function render(){
  const c=$('#content');
  if(state.page==='online'){renderOnline();return}
  if(state.page==='settings'){renderSettings();return}
  c.innerHTML=Array(10).fill('<div class="skeleton"></div>').join('');
  try{
    const type=state.page==='videos'?'video':'image';
    state.items=await api('/api/library?type='+type);
  }catch(e){c.innerHTML=`<div class="empty">${icon('x')}<div class="tip">${esc(e.message)}</div></div>`;return}
  let items=state.items;
  const q=$('#searchInput').value.trim().toLowerCase();
  if(q)items=items.filter(it=>it.title.toLowerCase().includes(q));
  $('#pageSub').textContent=`${TITLES[state.page][1]} · 共 ${items.length} 项`;
  if(!items.length){c.innerHTML=`<div class="empty">${icon('image')}<div class="tip">暂无壁纸，到「在线发现」找一张，或用设置里的导入</div></div>`;return}
  c.innerHTML='<div class="grid">'+items.map(cardHTML).join('')+'</div>';
}
render();refreshNow();
setInterval(refreshNow,3000);
/* 轮播等外部切换的兜底：窗口回到前台/可见时立即刷新，避免 3 秒空窗和缓存陈旧 */
window.addEventListener('focus',refreshNow);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshNow()});
</script>
</body>
</html>
